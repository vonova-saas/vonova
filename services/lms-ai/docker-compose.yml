version: '3.8'

services:
  lms-ai-backend:
    build: .
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005
      - MONGO_URI_ROADMAP_AI=mongodb://mongo:27017/ROADMAP_AI
      - MONGO_URI_PDF_SUMMARY_AI=mongodb://mongo:27017/LMS_AI
      - ROADMAP_AI_SERVICE_URL=http://roadmap-ai:5000
      - PDF_SUMMARY_AI_SERVICE_URL=http://pdf-summary-ai:5001
      - CORS_ORIGIN=http://localhost:3000
      - ALLOWED_ORIGINS=http://localhost:3000
      - SWAGGER_USER=admin
      - SWAGGER_PASSWORD=vonova2024
      # AWS S3 Configuration (set these in production)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-eu-north-1}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-cv-pdf-1234567890}
    depends_on:
      - mongo
    volumes:
      - ./logs:/app/logs
    networks:
      - lms-network

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongo_data:/data/db
    networks:
      - lms-network

  # AI Services (if running locally)
  roadmap-ai:
    image: python:3.11-slim
    ports:
      - "5000:5000"
    volumes:
      - ../models/roadmap_model:/app
    working_dir: /app
    command: python main.py
    networks:
      - lms-network

  pdf-summary-ai:
    image: python:3.11-slim
    ports:
      - "5001:5001"
    volumes:
      - ../models/pdfSummary_model:/app
    working_dir: /app
    command: python main.py
    networks:
      - lms-network

volumes:
  mongo_data:

networks:
  lms-network:
    driver: bridge
