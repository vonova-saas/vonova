services:
  nginx:
    image: nginx:1.27-alpine
    container_name: vonova-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - public_net
      - private_net
    restart: unless-stopped

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: vonova-api-gateway
    env_file:
      - ../.env
      - ../services/api-gateway/.env
    environment:
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_USER: ${NATS_USER:-}
      NATS_PASSWORD: ${NATS_PASSWORD:-}
    ports:
      - "4000:4000"
    depends_on:
      - nats
      - app-service
      - lms-service
      - admin-service
    networks:
      - private_net
      - public_net
    restart: unless-stopped


  admin-service:
    build:
      context: ../services/admin
      dockerfile: Dockerfile
    container_name: vonova-admin-service
    env_file:
      - ../.env
      - ../services/admin/.env
    environment:
      NODE_ENV: ${NODE_ENV:-}
      NATS_URL: ${NATS_URL:-}
      NATS_USER: ${NATS_USER:-}
      NATS_PASSWORD: ${NATS_PASSWORD:-}
      MONGO_URI_LOCAL_ADMIN: ${MONGO_URI_LOCAL_ADMIN:-}
      MONGO_DB_NAME_ADMIN: ${MONGO_DB_NAME_ADMIN:-}
      email_1: ${email_1:-}
      email_2: ${email_2:-}
      email_3: ${email_3:-}
      temp_password: ${temp_password:-}
      seed_admins_on_boot: ${seed_admins_on_boot:-}
    networks:
      - private_net
      - public_net
    restart: unless-stopped
    depends_on:
      - mongodb
      - nats
      - redis
    dns:
      - 8.8.8.8
      - 1.1.1.1

  app-service:
    build:
      context: ../services/app
      dockerfile: Dockerfile
    container_name: vonova-app-service
    env_file:
      - ../.env
      - ../services/app/.env
    environment:
      NODE_ENV: ${NODE_ENV:-}
      NATS_URL: ${NATS_URL:-}
      NATS_USER: ${NATS_USER:-}
      NATS_PASSWORD: ${NATS_PASSWORD:-}
      MONGO_URI_LOCAL_APP: ${MONGO_URI_LOCAL_APP:-}
      AWS_S3_ACCESS_KEY_ID_APP: ${AWS_S3_ACCESS_KEY_ID_APP:-}
      AWS_S3_SECRET_ACCESS_KEY_APP: ${AWS_S3_SECRET_ACCESS_KEY_APP:-}
      AWS_S3_BUCKET_APP: ${AWS_S3_BUCKET_APP:-}
      AWS_S3_REGION_APP: ${AWS_S3_REGION_APP:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - mongodb
      - nats
      - redis
    networks:
      - private_net
      - public_net
    restart: unless-stopped

  lms-service:
    build:
      context: ../services/lms
      dockerfile: Dockerfile
    container_name: vonova-lms-service
    env_file:
      - ../.env
      - ../services/lms/.env
    environment:
      NODE_ENV: ${NODE_ENV:-}
      NATS_URL: ${NATS_URL:-}
      NATS_USER: ${NATS_USER:-}
      NATS_PASSWORD: ${NATS_PASSWORD:-}
      MONGO_URI_LOCAL_LMS: ${MONGO_URI_LOCAL_LMS:-}
      MONGO_URI_ROADMAP_AI_LMS_AI: ${MONGO_URI_ROADMAP_AI_LMS_AI:-}
      MONGO_URI_PDF_SUMMARY_AI_LMS_AI: ${MONGO_URI_PDF_SUMMARY_AI_LMS_AI:-}
      MONGO_URI_PDF_SUMMARY_AI_AUDIO_LMS_AI: ${MONGO_URI_PDF_SUMMARY_AI_AUDIO_LMS_AI:-}
      MONGO_URI_ASSISTANT_LMS_AI: ${MONGO_URI_ASSISTANT_LMS_AI:-}
      MONGO_URI_PROBLEM_SOLVER_LMS_AI: ${MONGO_URI_PROBLEM_SOLVER_LMS_AI:-}
      MONGO_URI_VIDEO_GEN_LMS_AI: ${MONGO_URI_VIDEO_GEN_LMS_AI:-}
      AWS_S3_REGION_LMS: ${AWS_S3_REGION_LMS:-}
      AWS_S3_ACCESS_KEY_ID_LMS: ${AWS_S3_ACCESS_KEY_ID_LMS:-}
      AWS_S3_SECRET_ACCESS_KEY_LMS: ${AWS_S3_SECRET_ACCESS_KEY_LMS:-}
      AWS_S3_BUCKET_LMS: ${AWS_S3_BUCKET_LMS:-}
      AWS_ACCESS_KEY_ID_LMS_AI: ${AWS_ACCESS_KEY_ID_LMS_AI:-}
      AWS_SECRET_ACCESS_KEY_LMS_AI: ${AWS_SECRET_ACCESS_KEY_LMS_AI:-}
      AWS_REGION_LMS_AI: ${AWS_REGION_LMS_AI:-}
      AWS_S3_BUCKET_LMS_AI: ${AWS_S3_BUCKET_LMS_AI:-}
      AWS_S3_PRESIGN_EXPIRES_LMS_AI: ${AWS_S3_PRESIGN_EXPIRES_LMS_AI:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - mongodb
      - nats
    networks:
      - private_net
      - public_net
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    container_name: vonova-nats
    command:
      - "-js"
      - "--user"
      - "${NATS_USER:-}"
      - "--pass"
      - "${NATS_PASSWORD:-}"
    expose:
      - "4222"
    networks:
      - private_net
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: vonova-mongodb
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - private_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vonova-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    networks:
      - private_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true

volumes:
  mongo_data:
